<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Установка приложения</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: #1d1d1f;
      background: #f5f5f7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(255,255,255,.95), rgba(245,245,247,0) 58%),
        #f5f5f7;
    }
    main {
      width: min(100%, 408px);
      padding: 36px 32px 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 30px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 24px 70px rgba(25,35,55,.09), 0 2px 8px rgba(25,35,55,.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    img {
      width: 104px;
      height: 104px;
      border-radius: 24px;
      object-fit: cover;
      box-shadow: 0 10px 28px rgba(0,0,0,.16);
    }
    h1 {
      margin: 23px 0 8px;
      font-size: 27px;
      line-height: 1.18;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    #version {
      margin: 0;
      color: #6e6e73;
      font-size: 15px;
      font-weight: 450;
      letter-spacing: -0.01em;
    }
    #minimum-ios, #apple-id {
      margin: 5px 0 0;
      color: #8a8a90;
      font-size: 13px;
      line-height: 1.4;
      letter-spacing: -0.005em;
      overflow-wrap: anywhere;
    }
    .instructions {
      max-width: 300px;
      margin: 27px auto 21px;
      color: #5f6065;
      font-size: 14px;
      line-height: 1.55;
      letter-spacing: -0.005em;
    }
    a {
      display: block;
      padding: 15px 20px;
      border: 0;
      border-radius: 15px;
      color: #fff;
      background: #007aff;
      box-shadow: 0 5px 14px rgba(0,122,255,.22);
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: background-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    a:hover:not([aria-disabled="true"]) {
      background: #0874e8;
      box-shadow: 0 7px 18px rgba(0,122,255,.28);
      transform: translateY(-1px);
    }
    a:focus-visible {
      outline: 3px solid rgba(0,122,255,.35);
      outline-offset: 3px;
    }
    a[aria-disabled="true"] {
      opacity: .5;
      pointer-events: none;
      box-shadow: none;
    }
    #status {
      margin: 14px 0 0;
      color: #8a8a90;
      font-size: 13px;
    }
    @media (prefers-color-scheme: dark) {
      :root { color: #f5f5f7; background: #111113; }
      body {
        background:
          radial-gradient(ellipse at 50% 38%, rgba(50,50,55,.58), rgba(17,17,19,0) 60%),
          #111113;
      }
      main {
        border-color: rgba(255,255,255,.08);
        background: rgba(30,30,32,.88);
        box-shadow: 0 24px 70px rgba(0,0,0,.34), 0 2px 8px rgba(0,0,0,.18);
      }
      #version { color: #a1a1a6; }
      #minimum-ios, #apple-id, #status { color: #8e8e93; }
      .instructions { color: #b7b7bd; }
    }
    @media (max-width: 420px) {
      body { min-height: 100svh; padding: 18px 14px; }
      main { padding: 31px 23px 25px; border-radius: 26px; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { font-size: 25px; }
    }
    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <img id="icon" src="app-icon.png" alt="Иконка приложения">
    <h1 id="title">Приложение</h1>
    <p id="version"></p>
    <p id="minimum-ios" hidden></p>
    <p id="apple-id" hidden></p>
    <p class="instructions">Откройте эту страницу в Safari на iPhone или iPad и нажмите «Установить». Подтвердите установку приложения на устройстве.</p>
    <a id="install" href="itms-services://?action=download-manifest&amp;url=https%3A%2F%2Fgithub.com%2Fsergey119061976-creator%2FApps%2Freleases%2Flatest%2Fdownload%2Fmanifest.plist" aria-disabled="true">Установить</a>
    <p id="status" role="status">Загружаем сведения о выпуске…</p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const requestedTag = params.get('release');
    const releaseFolder = requestedTag
      ? './release-data/' + encodeURIComponent(requestedTag)
      : '.';
    const infoUrl = releaseFolder + '/app-info.json?refresh=' + Date.now();

    fetch(infoUrl, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('Нет данных о выпуске');
        return response.json();
      })
      .then(app => {
        document.title = app.title || 'Установка приложения';
        document.getElementById('title').textContent = app.title || 'Приложение';
        document.getElementById('version').textContent = app.version ? 'Версия ' + app.version : '';
        const minimumIosLine = document.getElementById('minimum-ios');
        if (typeof app.minimum_ios === 'string' && app.minimum_ios.trim()) {
          minimumIosLine.textContent = 'Минимальная iOS: ' + app.minimum_ios.trim();
          minimumIosLine.hidden = false;
        }
        const appleIdLine = document.getElementById('apple-id');
        if (typeof app.apple_id === 'string' && app.apple_id.trim()) {
          appleIdLine.textContent = 'Apple ID: ' + app.apple_id.trim();
          appleIdLine.hidden = false;
        }
        document.getElementById('icon').src =
          releaseFolder + '/app-icon.png?refresh=' + encodeURIComponent(app.tag || Date.now());
        const manifest = app.manifest;
        if (!manifest) throw new Error('У выпуска нет manifest.plist');
        document.getElementById('install').href =
          'itms-services://?action=download-manifest&url=' + encodeURIComponent(manifest);
        document.getElementById('install').setAttribute('aria-disabled', 'false');
        document.getElementById('status').remove();
      })
      .catch(() => {
        document.getElementById('status').textContent =
          requestedTag ? 'Данные этого релиза пока недоступны.' : 'Информация о выпуске пока недоступна.';
      });
  </script>
</body>
</html>
