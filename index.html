<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Установка приложения</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #171717; background: #f5f5f7; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 360px); text-align: center; }
    img { width: 112px; height: 112px; border-radius: 25px; object-fit: cover; box-shadow: 0 8px 28px #0002; }
    h1 { margin: 22px 0 6px; font-size: 25px; line-height: 1.2; }
    #version { margin: 0; color: #73737a; font-size: 15px; }
    .instructions { margin: 25px 0 20px; color: #5d5d63; font-size: 15px; line-height: 1.5; }
    a { display: block; padding: 14px 20px; border-radius: 13px; color: white; background: #087cff; text-decoration: none; font-weight: 650; }
    a[aria-disabled="true"] { opacity: .5; pointer-events: none; }
    #status { color: #73737a; font-size: 14px; }
    @media (prefers-color-scheme: dark) { :root { color: #f5f5f7; background: #111113; } .instructions { color: #b7b7bd; } }
  </style>
</head>
<body>
  <main>
    <img id="icon" src="app-icon.png" alt="Иконка приложения">
    <h1 id="title">Приложение</h1>
    <p id="version"></p>
    <p class="instructions">Откройте эту страницу в Safari на iPhone или iPad и нажмите «Установить». Подтвердите установку приложения на устройстве.</p>
    <a id="install" href="itms-services://?action=download-manifest&amp;url=https%3A%2F%2Fgithub.com%2Fsergey119061976-creator%2FApps%2Freleases%2Flatest%2Fdownload%2Fmanifest.plist" aria-disabled="true">Установить</a>
    <p id="status" role="status">Загружаем сведения о последней версии…</p>
  </main>
  <script>
    fetch('./app-info.json?refresh=' + Date.now(), { cache: 'no-store' })
      .then(response => { if (!response.ok) throw new Error('Нет данных о выпуске'); return response.json(); })
      .then(app => {
        document.title = app.title || 'Установка приложения';
        document.getElementById('title').textContent = app.title || 'Приложение';
        document.getElementById('version').textContent = app.version ? 'Версия ' + app.version : '';
        document.getElementById('icon').src = './app-icon.png?refresh=' + encodeURIComponent(app.tag || Date.now());
        const manifest = app.manifest || 'https://github.com/sergey119061976-creator/Apps/releases/latest/download/manifest.plist';
        document.getElementById('install').href = 'itms-services://?action=download-manifest&url=' + encodeURIComponent(manifest);
        document.getElementById('install').setAttribute('aria-disabled', 'false');
        document.getElementById('status').remove();
      })
      .catch(() => { document.getElementById('status').textContent = 'Информация о выпуске пока недоступна.'; });
  </script>
</body>
</html>
