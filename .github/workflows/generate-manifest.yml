name: Publish iOS release page data

on:
  release:
    types: [published, edited]
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-manifest.yml
      - scripts/generate_manifest.py
      - index.html
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to process
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-ios-release-page
  cancel-in-progress: false

jobs:
  find-releases:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.find.outputs.releases }}
      has_work: ${{ steps.find.outputs.has_work }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Find releases with a new IPA or missing release page
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            RELEASE_TAG="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/releases.json"
            jq -s '[.[0]]' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/releases-list.json"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$INPUT_RELEASE_TAG"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/releases.json"
            jq -s '[.[0]]' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/releases-list.json"
          else
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases-pages.json"
            jq -s 'add' "$RUNNER_TEMP/releases-pages.json" > "$RUNNER_TEMP/releases-list.json"
          fi

          FORCE_ALL=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            FORCE_ALL=true
          fi

          jq --arg force_all "$FORCE_ALL" -c '
            [
              .[]
              | select(.draft == false)
              | select(([.assets[]? | select(.name | ascii_downcase | endswith(".ipa"))] | length) == 1)
              | . as $release
              | ([.assets[]? | select(.name == "manifest.plist" or .name == "app-icon.png" or .name == "app-info.json") | .updated_at] | if length == 3 then min else "" end) as $generated
              | ([.assets[] | select(.name | ascii_downcase | endswith(".ipa"))][0].updated_at) as $ipa
              | select($force_all == "true" or $generated == "" or $generated < $ipa)
              | {tag: $release.tag_name}
            ]
          ' "$RUNNER_TEMP/releases-list.json" > "$RUNNER_TEMP/pending-releases.json"

          while IFS= read -r RELEASE_TAG; do
            if [ ! -f "release-data/$RELEASE_TAG/app-info.json" ]; then
              jq --arg tag "$RELEASE_TAG" '. += [{"tag": $tag}]' \
                "$RUNNER_TEMP/pending-releases.json" > "$RUNNER_TEMP/pending-releases.tmp"
              mv "$RUNNER_TEMP/pending-releases.tmp" "$RUNNER_TEMP/pending-releases.json"
            fi
          done < <(jq -r '.[] | select(.draft == false) | select(([.assets[]? | select(.name | ascii_downcase | endswith(".ipa"))] | length) == 1) | .tag_name' "$RUNNER_TEMP/releases-list.json")

          jq -c 'unique_by(.tag)' "$RUNNER_TEMP/pending-releases.json" > "$RUNNER_TEMP/pending-releases.tmp"
          mv "$RUNNER_TEMP/pending-releases.tmp" "$RUNNER_TEMP/pending-releases.json"

          if [ "$(jq 'length' "$RUNNER_TEMP/pending-releases.json")" -gt 0 ]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            jq -c '{include: .}' "$RUNNER_TEMP/pending-releases.json" | sed 's/^/releases=/' >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo 'releases={"include":[{"tag":"__none__"}]}' >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: find-releases
    if: needs.find-releases.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.find-releases.outputs.releases) }}
    env:
      RELEASE_TAG: ${{ matrix.tag }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PNG validation dependency
        run: python -m pip install Pillow

      - name: Set up Go for Assets.car extraction
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install carfile-go
        run: go install github.com/devcxm/carfile-go/cmd/carfile@v0.8.0

      - name: Load selected release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-event.json"

      - name: Generate manifest, icon, and app info
        run: |
          python scripts/generate_manifest.py \
            --event "$RUNNER_TEMP/release-event.json" \
            --output-dir dist

      - name: Upload generated files to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/manifest.plist \
            dist/app-icon.png \
            dist/app-info.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish this release's installation page data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "release-data/$RELEASE_TAG"
          cp dist/app-info.json "release-data/$RELEASE_TAG/app-info.json"
          cp dist/app-icon.png "release-data/$RELEASE_TAG/app-icon.png"

          LATEST_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$LATEST_TAG" = "$RELEASE_TAG" ]; then
            cp dist/app-info.json app-info.json
            cp dist/app-icon.png app-icon.png
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "release-data/$RELEASE_TAG/app-info.json" "release-data/$RELEASE_TAG/app-icon.png"
          if [ "$LATEST_TAG" = "$RELEASE_TAG" ]; then
            git add app-info.json app-icon.png
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish installation page for $RELEASE_TAG"
            git push origin HEAD:main
          fi

      - name: Add this release's unique links to run summary
        run: |
          IPA_URL="$(jq -r '.assets[] | select(.name | ascii_downcase | endswith(".ipa")) | .browser_download_url' "$RUNNER_TEMP/release-event.json")"
          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          TAG_QUERY="$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')"
          RELEASE_PAGE="${PAGES_URL}?release=${TAG_QUERY}"
          MANIFEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/manifest.plist"
          ENCODED_MANIFEST_URL="$(jq -rn --arg url "$MANIFEST_URL" '$url | @uri')"
          INSTALL_URL="itms-services://?action=download-manifest&url=${ENCODED_MANIFEST_URL}"

          {
            echo "## Отдельные ссылки для релиза $RELEASE_TAG"
            echo
            echo "- [Страница установки только версии $RELEASE_TAG]($RELEASE_PAGE)"
            echo "- [Скачать IPA только версии $RELEASE_TAG]($IPA_URL)"
            echo "- [Установить версию $RELEASE_TAG напрямую на iPhone/iPad]($INSTALL_URL)"
            echo "- [Скачать manifest для версии $RELEASE_TAG]($MANIFEST_URL)"
            echo "- [Открыть страницу релиза](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
